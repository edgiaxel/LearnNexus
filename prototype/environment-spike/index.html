<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>LearnNexus M0 Environment & Character Spike</title>
</head>

<body>
  <div class="spike-shell">
    <header class="spike-header">
      <div class="spike-title-group">
        <h1 class="spike-title">LearnNexus Environment Spike</h1>
        <span class="spike-pill">M0 Experimental Validation</span>
      </div>
      <div class="spike-controls">
        <button id="btn-config-a" class="btn is-active" type="button">Config A (16px @ 3x)</button>
        <button id="btn-config-b" class="btn" type="button">Config B (48px @ 1x)</button>
        <button id="btn-view-mode" class="btn" type="button">View: Follow</button>
        <button id="btn-debug" class="btn" type="button">Collision Debug [C]</button>
      </div>
    </header>

    <div class="spike-metrics" id="metrics-bar">
      <span>Mode: <strong id="m-mode">config-a-16px</strong></span>
      <span>Tile: <strong id="m-tile">16px</strong></span>
      <span>Zoom: <strong id="m-zoom">3x</strong></span>
      <span>FPS: <strong id="m-fps">--</strong></span>
      <span>Pos (tile): <strong id="m-pos">3.5, 11.8</strong></span>
      <span>Facing: <strong id="m-facing">down</strong></span>
      <span>Anim: <strong id="m-anim">adam_idle_anim_down</strong></span>
      <span>Move: <strong>WASD / Arrows</strong></span>
    </div>

    <main class="stage-wrap">
      <div id="phaser-container" data-testid="phaser-canvas-container"></div>
    </main>
  </div>

  <div id="interaction-prompt" class="prompt-pill" hidden>
    Press [E] to inspect <span id="prompt-label"></span>
  </div>

  <div id="interaction-drawer" class="drawer-backdrop" hidden>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <span id="drawer-category" class="drawer-tag">Workstation</span>
        <button id="btn-close-drawer" class="btn" type="button">Close [Esc]</button>
      </div>
      <h2 id="drawer-title" style="margin: 0; font-size: 18px">Object</h2>
      <p id="drawer-summary" style="margin: 0; font-size: 14px; line-height: 1.5"></p>
      <p id="drawer-notes" style="margin: 0; font-size: 12px; color: var(--color-text-secondary)"></p>
    </aside>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
